{% extends 'base.html' %}{% block content %}<div class="page-heading"><span class="eyebrow">INCREMENT 01 / INTAKE</span><h1>Submit a new claim</h1><p>Enter synthetic data and upload a supporting document. Fields marked * are required.</p></div><section class="panel form-panel"><form action="/claims/new" method="post" enctype="multipart/form-data"><div class="form-grid"><label>Claimant name *<input name="claimant" placeholder="e.g. Demo Claimant" required></label><label>Policy number *<input name="policy_number" placeholder="e.g. POL-TEST-08" required></label><label>Incident date *<input type="date" name="incident_date" required></label><label>Claim amount (INR) *<input type="number" name="claim_amount" min="0.01" step="0.01" placeholder="12500" required></label><label>Claim category *<select name="category" required><option value="">Select category</option><option>Vehicle</option><option>Home</option><option>Travel</option><option>Health</option><option>Other</option></select></label><label>Supporting document (PDF/JPG/PNG/TXT, max 2 MB)<input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png,.txt"></label></div><div class="notice">For coursework only: upload synthetic documents. Missing documents always require review.</div><button class="btn" type="submit">Submit claim →</button></form></section>{% endblock %}
